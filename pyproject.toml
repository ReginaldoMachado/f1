[project]
name = "f1"
version = "0.1.0"
description = "Dashboard de dados históricos da Fórmula 1 com a OpenF1"
authors = [
    {name = "Reginaldo Machado",email = "regimachado79@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "streamlit>=1.50,<2.0",
    "httpx (>=0.27,<1.0)",
    "pydantic (>=2.7,<3.0)",
    "python-dotenv (>=1.0,<2.0)",
]

[tool.poetry]
packages = [{include = "f1", from = "src"}]

[tool.poetry.group.dev.dependencies]
ruff = "^0.11"
pytest = "^8.3"
pytest-cov = "^6.0"
pytest-mock = "^3.17.0"
pre-commit = "^4.7.0"
taskipy = "^1.14.1"

[tool.poetry.group.docs.dependencies]
mkdocs-material = "^9.8.0"

[tool.taskipy.tasks]
test = "pytest"
lint = "ruff check ."
format = "ruff format ."
docs = "mkdocs build --strict"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["f1"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=f1 --cov-report=term-missing --cov-fail-under=50 -m 'not integration'"
markers = ["integration: tests that call the live OpenF1 API"]

[tool.coverage.run]
source = ["f1"]
branch = true
